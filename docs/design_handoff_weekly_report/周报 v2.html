// ── equity curve ──────────────────────────────────────────────────────────────
function EquityCurve({ equity, accent }) {
  const W = 900, H = 140, PAD = { t:16, r:24, b:28, l:60 };
  const iW = W - PAD.l - PAD.r, iH = H - PAD.t - PAD.b;
  const min = Math.min(...equity) - 50, max = Math.max(...equity) + 50;
  const xScale = i => PAD.l + (i / (equity.length - 1)) * iW;
  const yScale = v => PAD.t + iH - ((v - min) / (max - min)) * iH;

  const pts = equity.map((v, i) => [xScale(i), yScale(v)]);
  const pathD = pts.map((p, i) => {
    if (i === 0) return `M${p[0]},${p[1]}`;
    const prev = pts[i-1];
    const cpx = (prev[0] + p[0]) / 2;
    return `C${cpx},${prev[1]} ${cpx},${p[1]} ${p[0]},${p[1]}`;
  }).join(' ');
  const areaD = pathD + ` L${pts[pts.length-1][0]},${PAD.t+iH} L${pts[0][0]},${PAD.t+iH} Z`;

  const accentOkl = accent === 'amber' ? 'oklch(0.78 0.15 72)' : 'oklch(0.72 0.18 145)';
  const gridVals = [min + (max-min)*0.25, min + (max-min)*0.5, min + (max-min)*0.75, max-50].map(Math.round);

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:H,display:'block'}}>
      <defs>
        <linearGradient id="equityGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={accentOkl} stopOpacity="0.18"/>
          <stop offset="100%" stopColor={accentOkl} stopOpacity="0"/>
        </linearGradient>
        <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>

      {/* grid */}
      {gridVals.map((v,i) => {
        const y = yScale(v);
        return (
          <g key={i}>
            <line x1={PAD.l} y1={y} x2={W-PAD.r} y2={y} stroke={C.border} strokeWidth="0.75" strokeDasharray="3 4"/>
            <text x={PAD.l-8} y={y+4} textAnchor="end" fontSize="9.5" fill={C.textDim} fontFamily="DM Mono">{v.toLocaleString()}</text>
          </g>
        );
      })}

      {/* baseline */}
      <line x1={PAD.l} y1={yScale(10000)} x2={W-PAD.r} y2={yScale(10000)} stroke={C.textDim} strokeWidth="0.5" strokeDasharray="1 3"/>

      {/* area + line */}
      <path d={areaD} fill="url(#equityGrad)"/>
      <path d={pathD} fill="none" stroke={accentOkl} strokeWidth="1.75" filter="url(#glow)"/>

      {/* dots */}
      {pts.map((p, i) => (
        <circle key={i} cx={p[0]} cy={p[1]} r={3} fill={accentOkl} stroke={C.surface} strokeWidth="1.5"/>
      ))}

      {/* x labels */}
      {data.days.map((d,i) => {
        const x = xScale(i+1);
        return <text key={i} x={x} y={H-4} textAnchor="middle" fontSize="9" fill={C.textDim} fontFamily="DM Mono">{d.day}</text>;
      })}
    </svg>
  );
}

// ── day card ──────────────────────────────────────────────────────────────────
const regimeStyles = {

  RANGE: { bg:'oklch(0.72 0.14 72 / 0.12)',  color:'oklch(0.78 0.15 72)',  label:'区间' },

function DayCard({ d }) {

  const pnlColor = d.pnl > 0 ? C.green : d.pnl < 0 ? C.red : C.textDim;
  return (
    <div style={{

}

// ── score bar ─────────────────────────────────────────────────────────────────
function ScoreBar({ label, score, accent }) {
  const accentColor = accent === 'amber' ? 'oklch(0.78 0.15 72)' : 'oklch(0.72 0.18 145)';
  const color = score >= 80 ? C.green : score >= 60 ? accentColor : C.red;
  const [animated, setAnimated] = useState(false);
  useEffect(() => { const t = setTimeout(()=>setAnimated(true), 200); return ()=>clearTimeout(t); }, []);
  return (
    <div style={{display:'flex', alignItems:'center', gap:12}}>
      <span style={{fontSize:12, color:C.textMid, width:72, flexShrink:0, textAlign:'right'}}>{label}</span>
      <div style={{flex:1, height:6, background:C.border, borderRadius:3, overflow:'hidden'}}>
        <div style={{
          height:'100%', borderRadius:3, background:color,
          width: animated ? score+'%' : '0%', transition:'width 0.8s cubic-bezier(0.2,1,0.3,1)',
          boxShadow:`0 0 8px ${color}66`,
        }}/>
      </div>
      <span className="mono" style={{fontSize:12, color, width:28, textAlign:'right'}}>{score}</span>
    </div>
  );
}

function TradeRow({ t, showNotes }) {

  const dirColor = t.dir === 'Long' ? C.green : C.red;
  return (
    <tr>
      <td className="mono" style={{color:C.textDim}}>{t.id}</td>
      <td className="mono" style={{color:C.textMid}}>{t.day} {t.time}</td>
      <td className="mono" style={{color:C.text, fontWeight:500}}>{t.inst}</td>
      <td style={{color:dirColor, fontWeight:500}}>{t.dir === 'Long' ? '↑ 做多' : '↓ 做空'}</td>
      <td className="mono" style={{color:C.textMid}}>{t.entry}</td>
      <td className="mono" style={{color:C.textMid}}>{t.exit}</td>
      <td className="mono" style={{
        color:rColor, fontWeight:600, fontSize:15,
        textShadow: t.r > 1 ? `0 0 10px ${rColor}99` : 'none',
      }}>
        {t.r > 0 ? '+' : ''}{t.r.toFixed(1)}R

      <td>
        <span style={{
          display:'inline-flex', alignItems:'center', justifyContent:'center',
          width:22, height:22, borderRadius:5,
          background: (gradeColor[t.execScore] || C.textDim) + '22',
          color: gradeColor[t.execScore] || C.textDim,
          fontSize:12, fontWeight:700, fontFamily:'DM Mono',
        }}>{t.execScore}</span>
      </td>
      {showNotes && <td style={{fontSize:11.5, color:C.textDim, maxWidth:180}}>{t.note}</td>}
    </tr>
  );
}

// ── section label ─────────────────────────────────────────────────────────────
function Sec({ children, accent }) {
  const accentColor = accent === 'amber' ? 'oklch(0.78 0.15 72)' : 'oklch(0.72 0.18 145)';
  return (
    <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:14}}>
      <div style={{width:3, height:14, background:accentColor, borderRadius:2, flexShrink:0}}/>
      <span style={{fontSize:11.5, fontWeight:600, color:C.textMid, letterSpacing:'0.07em'}}>{children}</span>
    </div>
  );
}

function Card({ children, style }) {
  return (
    <div style={{background:C.surface, border:`1px solid ${C.border}`, borderRadius:12, padding:'20px 22px', ...style}}>
      {children}
    </div>
  );
}

                <tr style={{borderBottom:`1px solid ${C.border}`}}>
                  {['编号','时间','品种','方向','进入','出场','盈亏','执行', ...(showTradeNotes ? ['备注'] : [])].map(h => (
                    <th key={h} style={{padding:'8px 10px', textAlign:'left', color:C.textDim, fontWeight:500, letterSpacing:'0.04em', fontSize:10.5}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {data.trades.map((t, i) => (
                  <tr key={t.id} style={{borderBottom:`1px solid ${i < data.trades.length-1 ? C.border : 'transparent'}`, transition:'background 0.15s'}}
                    onMouseEnter={e=>e.currentTarget.style.background=C.surface2}
                    onMouseLeave={e=>e.currentTarget.style.background='transparent'}
                  >
                    <td className="mono" style={{padding:'11px 10px', color:C.textDim, fontSize:11}}>{t.id}</td>
                    <td className="mono" style={{padding:'11px 10px', color:C.textMid}}>{t.day} {t.time}</td>
                    <td className="mono" style={{padding:'11px 10px', color:C.text, fontWeight:500}}>{t.inst}</td>
                    <td style={{padding:'11px 10px', color: t.dir === 'Long' ? C.green : C.red, fontWeight:500, fontSize:12}}>
                      {t.dir === 'Long' ? '↑ 做多' : '↓ 做空'}
                    </td>
                    <td className="mono" style={{padding:'11px 10px', color:C.textMid}}>{t.entry.toLocaleString()}</td>
                    <td className="mono" style={{padding:'11px 10px', color:C.textMid}}>{t.exit.toLocaleString()}</td>
                    <td className="mono" style={{padding:'11px 10px', color: t.r > 0 ? C.green : t.r < 0 ? C.red : C.textDim, fontWeight:600, fontSize:15,
                      textShadow: t.r > 1.5 ? `0 0 10px ${t.r > 0 ? C.green : C.red}88` : 'none',
                    }}>
                      {t.r > 0 ? '+' : ''}{t.r.toFixed(1)}R
                    </td>
                    <td style={{padding:'11px 10px'}}>
                      <span style={{
                        display:'inline-flex', alignItems:'center', justifyContent:'center',
                        width:22, height:22, borderRadius:5,
                        background:(gradeColor[t.execScore] || C.textDim)+'22',
                        color: gradeColor[t.execScore] || C.textDim,
                        fontSize:11, fontWeight:700, fontFamily:'DM Mono',
                      }}>{t.execScore}</span>
                    </td>
                    {showTradeNotes && (
                      <td style={{padding:'11px 10px', fontSize:11.5, color:C.textDim, maxWidth:200}}>{t.note}</td>
                    )}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* missed opportunities */}
          {data.missed.length > 0 && (
            <div style={{marginTop:14, paddingTop:14, borderTop:`1px dashed ${C.border}`}}>
              <span style={{fontSize:10.5, color:C.textDim, letterSpacing:'0.05em', marginBottom:8, display:'block'}}>错过的机会</span>
              {data.missed.map((m, i) => (
                <div key={i} style={{display:'flex', gap:12, alignItems:'center', fontSize:12}}>
                  <span className="mono" style={{color:C.textDim}}>{m.day} {m.time}</span>
                  <span className="mono" style={{color:C.text}}>{m.inst}</span>
                  <span style={{color: m.dir === 'Long' ? C.green : C.red}}>{m.dir === 'Long' ? '↑' : '↓'}</span>
                  <span className="mono" style={{color:C.red}}>~+{m.estR}R</span>
                  <span style={{color:C.textDim, flex:1}}>{m.reason}</span>
                </div>
              ))}
            </div>
          )}
        </Card>

        {/* system score + highlights/weaknesses */}
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:16, marginBottom:16}}>

          {/* system score */}
          <Card>
            <Sec accent={accent}>系统遵守度</Sec>
            <div style={{display:'flex', alignItems:'center', justifyContent:'center', marginBottom:20}}>
              <div style={{position:'relative', width:96, height:96}}>
                <svg viewBox="0 0 96 96" style={{width:96, height:96, transform:'rotate(-90deg)'}}>
                  <circle cx="48" cy="48" r="38" fill="none" stroke={C.border} strokeWidth="8"/>
                  <circle cx="48" cy="48" r="38" fill="none" stroke={accentColor} strokeWidth="8"
                    strokeDasharray={`${2*Math.PI*38 * data.systemScore.total/100} ${2*Math.PI*38}`}
                    strokeLinecap="round" style={{transition:'stroke-dasharray 1s cubic-bezier(0.2,1,0.3,1)'}}
                  />
                </svg>
                <div style={{position:'absolute', inset:0, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center'}}>
                  <span className="mono" style={{fontSize:22, fontWeight:500, color:accentColor, lineHeight:1}}>{data.systemScore.total}</span>
                  <span style={{fontSize:9, color:C.textDim}}>/ 100</span>
                </div>
              </div>
            </div>
            <div style={{display:'flex', flexDirection:'column', gap:10}}>
              {data.systemScore.dims.map(d => <ScoreBar key={d.label} label={d.label} score={d.score} accent={accent}/>)}
            </div>
          </Card>

          {/* highlights + weaknesses */}
          <div style={{display:'flex', flexDirection:'column', gap:10}}>
            <Card style={{flex:1}}>
              <Sec accent={accent}>本周亮点</Sec>
              <div style={{display:'flex', flexDirection:'column', gap:8}}>
                {data.highlights.map((h, i) => (
                  <div key={i} style={{display:'flex', gap:10, alignItems:'flex-start', fontSize:12.5, lineHeight:1.6, color:C.textMid}}>
                    <span style={{color:C.green, flexShrink:0, marginTop:1}}>↑</span>{h}
                  </div>
                ))}
              </div>
            </Card>
            <Card style={{flex:1}}>
              <Sec accent={accent}>本周不足</Sec>
              <div style={{display:'flex', flexDirection:'column', gap:8}}>
                {data.weaknesses.map((w, i) => (
                  <div key={i} style={{display:'flex', gap:10, alignItems:'flex-start', fontSize:12.5, lineHeight:1.6, color:C.textMid}}>
                    <span style={{color:C.red, flexShrink:0, marginTop:1}}>↓</span>{w}
                  </div>
                ))}
              </div>
            </Card>
          </div>
        </div>

        {/* lessons */}
        <Card style={{marginBottom:16}}>
          <Sec accent={accent}>核心经验教训</Sec>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:12}}>
            {data.lessons.map((l, i) => (
              <div key={i} style={{display:'flex', gap:14, padding:'14px 16px', background:C.surface2, borderRadius:10, border:`1px solid ${C.border}`}}>
                <span className="mono" style={{
                  fontSize:11, fontWeight:700, color:accentColor,
                  background:accentColor+'18', width:24, height:24, borderRadius:6,
                  display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0,
                }}>{i+1}</span>
                <div>
                  <div style={{fontSize:13, fontWeight:500, color:C.text, marginBottom:5, lineHeight:1.4}}>{l.title}</div>
                  <div style={{fontSize:12, lineHeight:1.7, color:C.textDim}}>{l.body}</div>
                </div>
              </div>
            ))}
          </div>
        </Card>

        {/* next week */}
        <Card>
          <Sec accent={accent}>下周计划</Sec>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:16}}>
            {[
              { icon:'◎', label:'宏观关注', items: data.nextWeek.macro },
              { icon:'◆', label:'重点练习', items: data.nextWeek.practice },
              { icon:'→', label:'特别注意', items: data.nextWeek.watch },
            ].map(col => (
              <div key={col.label}>
                <div style={{display:'flex', alignItems:'center', gap:7, marginBottom:10}}>
                  <span style={{fontSize:10, color:accentColor}}>{col.icon}</span>
                  <span style={{fontSize:11, color:C.textDim, fontWeight:500, letterSpacing:'0.04em'}}>{col.label}</span>
                </div>
                <div style={{display:'flex', flexDirection:'column', gap:8}}>
                  {col.items.map((item, i) => (
                    <div key={i} style={{display:'flex', gap:8, alignItems:'flex-start', fontSize:12.5, lineHeight:1.6, color:C.textMid}}>
                      <span className="mono" style={{color:C.border, flexShrink:0}}>—</span>{item}
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </Card>

        {/* footer */}
        <div style={{marginTop:32, display:'flex', justifyContent:'space-between', alignItems:'center'}}>
          <span className="mono" style={{fontSize:10, color:C.textDim}}>W{data.week} · {data.year} · 系统周报</span>
          <span className="mono" style={{fontSize:10, color:C.textDim}}>{data.range}</span>
        </div>

      </div>

      <TweaksPanel>
        <TweakSection label="强调色">
          <TweakRadio id="accent" options={[{label:'琥珀',value:'amber'},{label:'绿色',value:'green'}]}/>
        </TweakSection>
        <TweakSection label="备注列">
          <TweakToggle id="showTradeNotes" label="显示交易备注"/>
        </TweakSection>
      </TweaksPanel>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
