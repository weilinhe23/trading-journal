// ── month equity curve (full month, week-segmented) ──────────────────────────
function MonthEquity({ data, accent }) {
  const W = 1100, H = 160, PAD = { t:16, r:24, b:30, l:60 };
  const iW = W - PAD.l - PAD.r, iH = H - PAD.t - PAD.b;
  const min = Math.min(...data) - 80, max = Math.max(...data) + 80;
  const xScale = i => PAD.l + (i / (data.length - 1)) * iW;
  const yScale = v => PAD.t + iH - ((v - min) / (max - min)) * iH;
  const pts = data.map((v, i) => [xScale(i), yScale(v)]);

  const pathD = pts.map((p, i) => {
    if (i === 0) return `M${p[0]},${p[1]}`;
    const prev = pts[i-1];
    const cpx = (prev[0] + p[0]) / 2;
    return `C${cpx},${prev[1]} ${cpx},${p[1]} ${p[0]},${p[1]}`;
  }).join(' ');
  const areaD = pathD + ` L${pts[pts.length-1][0]},${PAD.t+iH} L${pts[0][0]},${PAD.t+iH} Z`;

  // 4 周边界
  const weekBoundaries = [0, 4, 8, 12, 16];
  const baseY = yScale(10000);

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:H,display:'block'}}>
      <defs>
        <linearGradient id="moEq" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={accent} stopOpacity="0.22"/>
          <stop offset="100%" stopColor={accent} stopOpacity="0"/>
        </linearGradient>
      </defs>

      {/* week separators */}
      {weekBoundaries.slice(1, -1).map((i, idx) => (
        <line key={idx} x1={xScale(i)} y1={PAD.t} x2={xScale(i)} y2={H-PAD.b}
          stroke={C.border} strokeWidth="1" strokeDasharray="2 4" opacity="0.6"/>
      ))}

      {/* baseline */}
      <line x1={PAD.l} y1={baseY} x2={W-PAD.r} y2={baseY} stroke={C.textDim} strokeWidth="0.5" strokeDasharray="1 3" opacity="0.5"/>
      <text x={PAD.l-8} y={baseY+4} textAnchor="end" fontSize="9.5" fill={C.textDim} fontFamily="DM Mono">$10k</text>

      {[10500, 11000, 11500].map(v => {
        const y = yScale(v);
        return (
          <g key={v}>
            <line x1={PAD.l} y1={y} x2={W-PAD.r} y2={y} stroke={C.border} strokeWidth="0.5" strokeDasharray="2 4" opacity="0.4"/>
            <text x={PAD.l-8} y={y+4} textAnchor="end" fontSize="9.5" fill={C.textDim} fontFamily="DM Mono">${(v/1000).toFixed(1)}k</text>
          </g>
        );
      })}

      <path d={areaD} fill="url(#moEq)"/>
      <path d={pathD} fill="none" stroke={accent} strokeWidth="1.75"/>

      {/* week labels in middle of each week segment */}
      {weeks.map((w, i) => {
        const start = xScale(i * 4);
        const end = xScale((i + 1) * 4);
        return (
          <text key={w.w} x={(start+end)/2} y={H-8} textAnchor="middle"
            fontSize="10.5" fill={C.textMid} fontFamily="DM Mono" fontWeight="500">
            W{w.w}
          </text>
        );
      })}

      {/* end point */}
      <circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r="4" fill={accent} stroke={C.bg} strokeWidth="2"/>
      <circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r="9" fill={accent} opacity="0.18"/>
    </svg>
  );
}

// ── week sparkline ───────────────────────────────────────────────────────────
function WeekSpark({ data, color }) {
  const W = 200, H = 36;
  const min = Math.min(...data), max = Math.max(...data);
  const range = Math.max(max - min, 1);
  const pts = data.map((v, i) => [
    (i / (data.length - 1)) * W,
    H - 4 - ((v - min) / range) * (H - 8),
  ]);
  const pathD = pts.map((p, i) => i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`).join(' ');
  const areaD = pathD + ` L${W},${H} L0,${H} Z`;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{width:'100%', height:H, display:'block'}}>
      <path d={areaD} fill={color} opacity="0.15"/>
      <path d={pathD} fill="none" stroke={color} strokeWidth="1.5"/>
    </svg>
  );
}

            <div style={{display:'flex', alignItems:'center', gap:6}}>
              <div style={{width:6, height:6, borderRadius:'50%', background: totalPnl >= 0 ? C.green : C.red, boxShadow:`0 0 6px ${totalPnl >= 0 ? C.green : C.red}`}}/>
              <span className="mono" style={{fontSize:13, color: totalPnl >= 0 ? C.green : C.red, fontWeight:500}}>{fmt(totalPnl)}</span>
            </div>
            <span style={{width:1, height:14, background:C.border, display:'block'}}/>
            <div style={{display:'flex', gap:6}}>
              {['‹','›'].map((a,i) => (
                <button key={i} style={{width:28, height:28, borderRadius:6, border:`1px solid ${C.border}`, background:'none', color:C.textDim, cursor:'pointer', fontSize:14, transition:'all 0.15s'}}
                  onMouseEnter={e=>{e.currentTarget.style.color=C.text; e.currentTarget.style.borderColor=C.borderHi;}}
                  onMouseLeave={e=>{e.currentTarget.style.color=C.textDim; e.currentTarget.style.borderColor=C.border;}}
                >{a}</button>
              ))}
            </div>
          </div>
        </div>
      </div>

      {/* ── body ── */}
      <div style={{maxWidth:1280, margin:'0 auto', padding:'32px 32px 80px'}}>

        {/* hero */}
        <div style={{marginBottom:20}}>
          <div style={{display:'flex', alignItems:'baseline', justifyContent:'space-between', marginBottom:18}}>
            <div>
              <div style={{fontSize:11.5, color:C.textDim, letterSpacing:'0.08em', marginBottom:6}}>4 周累计净盈亏</div>
              <div style={{display:'flex', alignItems:'baseline', gap:14}}>
                <span className="mono" style={{fontSize:48, fontWeight:500, letterSpacing:'-0.03em', color: totalPnl >= 0 ? C.green : C.red, lineHeight:1}}>{fmt(totalPnl)}</span>
                <span className="mono" style={{fontSize:14, color:C.textDim}}>· {((totalPnl/10000)*100).toFixed(1)}%</span>
              </div>
            </div>
            <div style={{display:'flex', gap:24}}>
              {[
                { l:'交易', v:totalTrades, c:C.text },
                { l:'胜率', v:monthWinRate+'%', c: monthWinRate >= 60 ? C.green : C.text },
                { l:'盈利周', v:`${profitableWeeks}/${weeks.length}`, c: profitableWeeks >= 3 ? C.green : C.amber },
                { l:'平均系统分', v:monthScore, c:accent },
              ].map(s => (
                <div key={s.l} style={{textAlign:'right'}}>
                  <div className="mono" style={{fontSize:20, fontWeight:500, color:s.c, lineHeight:1.1}}>{s.v}</div>
                  <div style={{fontSize:10, color:C.textDim, marginTop:3}}>{s.l}</div>
                </div>
              ))}
            </div>
          </div>
          <Card>
            <MonthEquity data={monthEquity} accent={accent}/>
          </Card>
        </div>

        {/* ── 4 周卡片（核心区） ── */}
        <Sec accent={accent} sub="点击卡片查看完整周报">本月四周</Sec>
        <div style={{display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:12, marginBottom:24}}>
          {weeks.map(w => (
            <WeekCard key={w.w} w={w} accent={accent}
              expanded={expandedWeek === w.w}
              onToggle={() => setExpandedWeek(expandedWeek === w.w ? null : w.w)}
            />
          ))}
        </div>

        {/* ── 跨周聚合区 ── */}
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:16, marginBottom:16}}>

          {/* recurring lessons */}
          <Card>
            <Sec accent={accent} sub="跨周出现的高频教训">重复教训追踪</Sec>
            <div style={{display:'flex', flexDirection:'column', gap:10}}>
              {MONTH.recurringLessons.map((l, i) => {
                const sevColor = l.severity === 'high' ? C.red : l.severity === 'medium' ? C.amber : C.textMid;
                const recurring = l.occurredIn.length > 1;
                return (
                  <div key={i} style={{
                    padding:'12px 14px', background:C.surface2, borderRadius:10,
                    border:`1px solid ${C.border}`,
                    borderLeft: recurring ? `3px solid ${sevColor}` : `1px solid ${C.border}`,
                  }}>
                    <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:10}}>
                      <span style={{fontSize:12.5, color:C.text, lineHeight:1.5, flex:1}}>{l.text}</span>
                      <div style={{display:'flex', gap:4, flexShrink:0}}>
                        {l.occurredIn.map(wn => (
                          <span key={wn} className="mono" style={{
                            fontSize:9.5, padding:'2px 6px',
                            background: sevColor + '22', color: sevColor,
                            borderRadius:3, fontWeight:600,
                          }}>W{wn}</span>
                        ))}
                      </div>
                    </div>
                    {recurring && (
                      <div style={{marginTop:6, fontSize:10, color:sevColor, display:'flex', alignItems:'center', gap:4}}>
                        <span>⚠</span>
                        <span>已重复出现 {l.occurredIn.length} 次，需重点强化</span>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </Card>

          {/* persistent issues */}
          <Card>
            <Sec accent={accent} sub="跨周持续存在的问题">持续性问题</Sec>
            <div style={{display:'flex', flexDirection:'column', gap:10}}>
              {MONTH.persistentIssues.map((p, i) => (
                <div key={i} style={{padding:'12px 14px', background:C.surface2, borderRadius:10, border:`1px solid ${C.border}`}}>
                  <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8}}>
                    <span style={{fontSize:12.5, color:C.text, fontWeight:500}}>{p.issue}</span>
                    <span className="mono" style={{fontSize:13, fontWeight:600, color:C.red}}>{fmtR(p.totalLoss)}</span>
                  </div>
                  {/* timeline indicator */}
                  <div style={{display:'flex', alignItems:'center', gap:8}}>
                    <span style={{fontSize:10, color:C.textDim, width:50}}>影响周</span>
                    <div style={{display:'flex', gap:4, flex:1}}>
                      {weeks.map(w => {
                        const affected = p.weeksAffected.includes(w.w);
                        return (
                          <div key={w.w} style={{
                            flex:1, height:6, borderRadius:2,
                            background: affected ? C.red : C.border,
                            opacity: affected ? 1 : 0.5,
                          }} title={`W${w.w}`}/>
                        );
                      })}
                    </div>
                    <span className="mono" style={{fontSize:10, color:C.red, width:30, textAlign:'right'}}>{p.weeksAffected.length}/4</span>
                  </div>
                </div>
              ))}
            </div>
          </Card>

        </div>

        {/* ── 4 周交易明细聚合 ── */}
        <Card style={{marginBottom:16}}>
          <Sec accent={accent} sub={`${allTrades.length} 笔 · 按周分组`}>本月交易明细</Sec>

          {/* summary strip */}
          <div style={{
            display:'grid', gridTemplateColumns:'repeat(6, 1fr)', gap:0,
            background:C.surface2, borderRadius:8, marginBottom:14,
            border:`1px solid ${C.border}`,
          }}>
            {(() => {
              const wins = allTrades.filter(t => t.r > 0);
              const losses = allTrades.filter(t => t.r < 0);
              const totalR = allTrades.reduce((s,t) => s + t.r, 0);
              const avgWin = wins.length ? wins.reduce((s,t) => s + t.r, 0) / wins.length : 0;
              const avgLoss = losses.length ? Math.abs(losses.reduce((s,t) => s + t.r, 0) / losses.length) : 0;
              const pf = avgLoss ? (avgWin * wins.length) / (avgLoss * losses.length) : 0;
              const aGrade = allTrades.filter(t => t.score === 'A').length;
              const dGrade = allTrades.filter(t => t.score === 'D').length;
              return [
                { l:'累计盈亏', v:fmtR(totalR), c: totalR >= 0 ? C.green : C.red },
                { l:'胜/负',   v:`${wins.length}/${losses.length}`, c:C.text },
                { l:'平均盈利', v:fmtR(avgWin), c:C.green },
                { l:'平均亏损', v:fmtR(-avgLoss), c:C.red },
                { l:'盈亏比',   v:pf.toFixed(2), c: pf >= 2 ? C.green : C.amber },
                { l:'A级 / D级', v:`${aGrade} / ${dGrade}`, c: aGrade > dGrade ? C.green : C.amber },
              ].map((s, i, arr) => (
                <div key={s.l} style={{
                  padding:'12px 14px', textAlign:'center',
                  borderRight: i < arr.length - 1 ? `1px solid ${C.border}` : 'none',
                }}>
                  <div className="mono" style={{fontSize:15, fontWeight:500, color:s.c, lineHeight:1.1}}>{s.v}</div>
                  <div style={{fontSize:10, color:C.textDim, marginTop:4}}>{s.l}</div>
                </div>
              ));
            })()}
          </div>

          {/* trade table grouped by week */}
          <div style={{overflowX:'auto'}}>
            <table style={{width:'100%', borderCollapse:'collapse', fontSize:12}}>
              <thead>
                <tr style={{borderBottom:`1px solid ${C.border}`}}>
                  {['#','日期/时间','品种','方向','进入','出场','Setup','环境','盈亏','执行','备注'].map(h => (
                    <th key={h} style={{padding:'8px 10px', textAlign:'left', color:C.textDim, fontWeight:500, letterSpacing:'0.04em', fontSize:10}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {weeks.map(week => {
                  const weekTrades = allTrades.filter(t => t.w === week.w);
                  if (weekTrades.length === 0) return null;
                  const weekR = weekTrades.reduce((s,t) => s + t.r, 0);
                  return (
                    <React.Fragment key={week.w}>
                      {/* week separator row */}
                      <tr style={{background:`${accent}0d`}}>
                        <td colSpan="11" style={{padding:'8px 10px'}}>
                          <div style={{display:'flex', alignItems:'center', gap:12, fontSize:11}}>
                            <span className="mono" style={{color:accent, fontWeight:600, letterSpacing:'0.06em'}}>WEEK {week.w}</span>
                            <span style={{color:C.textDim}}>{week.range}</span>
                            <span style={{flex:1}}/>
                            <span className="mono" style={{color:C.textDim}}>{weekTrades.length} 笔</span>
                            <span className="mono" style={{color: weekR >= 0 ? C.green : C.red, fontWeight:600}}>{fmtR(weekR)}</span>
                            <span className="mono" style={{color: week.pnl >= 0 ? C.green : C.red, fontWeight:500, minWidth:64, textAlign:'right'}}>{fmt(week.pnl)}</span>
                          </div>
                        </td>
                      </tr>
                      {weekTrades.map((t, i) => {
                        const rColor = t.r > 0 ? C.green : t.r < 0 ? C.red : C.textDim;
                        const dirColor = t.dir === 'Long' ? C.green : C.red;
                        const gradeColor = { A:C.green, B:'oklch(0.72 0.15 145)', C:C.amber, D:C.red }[t.score] || C.textDim;
                        const regimeColor = { TREND:C.green, CHOP:C.red, RANGE:C.amber }[t.regime];
                        const regimeLabel = { TREND:'趋势', CHOP:'震荡', RANGE:'区间' }[t.regime];
                        return (
                          <tr key={t.id} style={{
                            borderBottom: `1px solid ${C.border}`,
                            transition: 'background 0.15s',
                          }}
                            onMouseEnter={e => e.currentTarget.style.background = C.surface2}
                            onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
                          >
                            <td className="mono" style={{padding:'10px', color:C.textDim, fontSize:10.5}}>{t.id}</td>
                            <td className="mono" style={{padding:'10px', color:C.textMid}}>{t.date}<span style={{color:C.textDim, marginLeft:6, fontSize:10.5}}>{t.time}</span></td>
                            <td className="mono" style={{padding:'10px', color:C.text, fontWeight:500}}>{t.inst}</td>
                            <td style={{padding:'10px', color:dirColor, fontWeight:500, fontSize:11.5}}>{t.dir === 'Long' ? '↑ 多' : '↓ 空'}</td>
                            <td className="mono" style={{padding:'10px', color:C.textMid, fontSize:11}}>{t.entry.toLocaleString()}</td>
                            <td className="mono" style={{padding:'10px', color:C.textMid, fontSize:11}}>{t.exit.toLocaleString()}</td>
                            <td style={{padding:'10px', color:C.textMid, fontSize:11}}>{t.setup}</td>
                            <td style={{padding:'10px'}}>
                              <span style={{
                                fontSize:10, padding:'2px 7px', borderRadius:4,
                                background: regimeColor + '22', color: regimeColor,
                                fontWeight:500,
                              }}>{regimeLabel}</span>
                            </td>
                            <td className="mono" style={{
                              padding:'10px', color:rColor, fontWeight:600, fontSize:14,
                              textShadow: Math.abs(t.r) >= 2 ? `0 0 10px ${rColor}88` : 'none',
                            }}>{fmtR(t.r)}</td>
                            <td style={{padding:'10px'}}>
                              <span style={{
                                display:'inline-flex', alignItems:'center', justifyContent:'center',
                                width:20, height:20, borderRadius:5,
                                background: gradeColor + '22', color: gradeColor,
                                fontSize:10.5, fontWeight:700, fontFamily:'DM Mono',
                              }}>{t.score}</span>
                            </td>
                            <td style={{padding:'10px', fontSize:11, color:C.textDim, maxWidth:180}}>{t.note}</td>
                          </tr>
                        );
                      })}
                    </React.Fragment>
                  );
                })}
              </tbody>
            </table>
          </div>
        </Card>

        {/* ── 月度最佳/最差 ── */}
        <Card style={{marginBottom:16}}>
          <Sec accent={accent}>本月之最</Sec>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:12}}>
            {[
              { tag:'最佳交易', t:monthBest, color:C.green },
              { tag:'最差交易', t:monthWorst, color:C.red },
            ].map(({ tag, t, color }) => t && (
              <div key={tag} style={{
                padding:'14px 18px', background:C.surface2, borderRadius:10,
                border:`1px solid ${C.border}`, borderLeft:`3px solid ${color}`,
                display:'flex', alignItems:'center', gap:18,
              }}>
                <div style={{flex:1}}>
                  <div style={{fontSize:10, color, fontWeight:600, letterSpacing:'0.06em', marginBottom:6}}>{tag}</div>
                  <div style={{display:'flex', alignItems:'baseline', gap:10}}>
                    <span className="mono" style={{fontSize:13, color:C.text, fontWeight:500}}>{t.inst}</span>
                    <span style={{fontSize:11, color: t.dir === 'Long' ? C.green : C.red}}>
                      {t.dir === 'Long' ? '↑ 做多' : '↓ 做空'}
                    </span>
                    <span className="mono" style={{fontSize:10.5, color:C.textDim, marginLeft:'auto'}}>{t.date}</span>
                  </div>
                </div>
                <span className="mono" style={{
                  fontSize:28, fontWeight:600, color, lineHeight:1,
                  textShadow:`0 0 12px ${color}55`,
                }}>{fmtR(t.r)}</span>
              </div>
            ))}
          </div>
        </Card>

        {/* ── 月度提炼 ── */}
        <Card style={{marginBottom:16, borderLeft:`3px solid ${accent}`}}>
          <Sec accent={accent} sub="基于 4 周观察提炼">月度复盘</Sec>
          <p style={{fontSize:14, lineHeight:1.85, color:C.text}}>
            {MONTH.monthInsight}
          </p>
        </Card>

        {/* footer */}
        <div style={{marginTop:32, paddingTop:20, borderTop:`1px solid ${C.border}`, display:'flex', justifyContent:'space-between', alignItems:'center'}}>
          <span className="mono" style={{fontSize:10, color:C.textDim}}>
            {MONTH.monthLabel} · 月度汇总（聚合 W{weeks[0].w}–W{weeks[weeks.length-1].w}）
          </span>
          <span className="mono" style={{fontSize:10, color:C.textDim}}>{MONTH.range}</span>
        </div>

      </div>

      <TweaksPanel>
        <TweakSection label="强调色">
          <TweakRadio id="accent" options={[{label:'琥珀',value:'amber'},{label:'绿色',value:'green'}]}/>
        </TweakSection>
      </TweaksPanel>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
